name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test engine & build plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # runPluginVerifier downloads full IDE distributions for every plugin; the default runner
      # disk fills and the job dies with "No space left on device". Reclaim space up front.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/.ghcup /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo swapoff -a || true; sudo rm -f /mnt/swapfile || true
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Test all modules
        run: ./gradlew test --stacktrace

      - name: Verify, check deprecated API & build every plugin
        run: |
          set -e
          mkdir -p dist
          for dir in plugins/*/; do
            name=$(basename "$dir")
            ./gradlew ":plugins:${name}:verifyPlugin" ":plugins:${name}:runPluginVerifier" ":plugins:${name}:buildPlugin" --stacktrace
            # Stash the zip, then drop this plugin's build output so the sandbox/artifacts of all
            # plugins don't accumulate and fill the runner disk mid-loop.
            cp "plugins/${name}/build/distributions/"*.zip dist/ 2>/dev/null || true
            rm -rf "plugins/${name}/build"
            df -h / | tail -1
          done

      - name: Upload plugin distributions
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: plugin-distributions
          path: dist/*.zip
          retention-days: 5
