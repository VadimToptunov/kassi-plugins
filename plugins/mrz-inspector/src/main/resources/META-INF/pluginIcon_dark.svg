<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mrzBgDark" x1="8" y1="4" x2="32" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C084FC"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <!-- Portrait ID card: a vertical silhouette, distinct from the other plugins' horizontal cards -->
  <rect x="9" y="4" width="22" height="32" rx="3.5" fill="url(#mrzBgDark)"/>
  <!-- Photo placeholder -->
  <circle cx="15.5" cy="12.5" r="3.3" fill="#0B1120" fill-opacity="0.75"/>
  <!-- Name lines -->
  <rect x="20.5" y="10.5" width="7" height="1.6" rx="0.8" fill="#0B1120" fill-opacity="0.75"/>
  <rect x="20.5" y="13.5" width="5" height="1.6" rx="0.8" fill="#0B1120" fill-opacity="0.5"/>
  <!-- MRZ rows: monospace dash lines at the bottom -->
  <rect x="12" y="24" width="16" height="1.6" rx="0.4" fill="#78350F"/>
  <rect x="12" y="27.2" width="16" height="1.6" rx="0.4" fill="#78350F"/>
  <rect x="12" y="30.4" width="16" height="1.6" rx="0.4" fill="#78350F"/>
</svg>
