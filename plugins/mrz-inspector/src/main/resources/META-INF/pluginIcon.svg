  <circle cx="15.5" cy="12.5" r="3.3" fill="#FFFFFF" fill-opacity="0.85"/>
  <!-- Name lines -->
  <rect x="20.5" y="10.5" width="7" height="1.6" rx="0.8" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="20.5" y="13.5" width="5" height="1.6" rx="0.8" fill="#FFFFFF" fill-opacity="0.6"/>
  <!-- MRZ rows: monospace dash lines at the bottom -->
  <rect x="12" y="24" width="16" height="1.6" rx="0.4" fill="#FDE68A"/>
  <rect x="12" y="27.2" width="16" height="1.6" rx="0.4" fill="#FDE68A"/>
  <rect x="12" y="30.4" width="16" height="1.6" rx="0.4" fill="#FDE68A"/>
</svg>
